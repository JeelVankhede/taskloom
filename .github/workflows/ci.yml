name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires these to load. `prisma generate` never connects, and the
      # database tests start their own PostgreSQL through Testcontainers and override them.
      DIRECT_DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      SHADOW_DATABASE_URL: postgresql://unused:unused@localhost:5432/unused_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:contracts
      - run: npm run prisma:generate -w @taskloom/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run build-storybook -w @taskloom/web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Local development values: the compose database, the API, and the Vite proxy read them.
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run build:contracts
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # The main suite: the web app against a mocked API. No database, fast.
      - run: npm run e2e
      # One smoke test against the real stack (API, PostgreSQL, PgBouncer, Vite proxy).
      - run: npm run db:up
      - run: npm run migrate
      - run: npm run build -w @taskloom/api
      - run: npm run e2e:stack
