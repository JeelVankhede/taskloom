# Taskloom GraphQL schema (schema-first). Grows phase by phase; see docs/implementation-plan.md.
#
# Org selection: `viewer`, `createOrganization`, `requestToJoinOrganization`, and
# `cancelJoinRequest` run without an organization. Every other root field needs the selected
# organization id in the `X-Org-Id` header. A hidden row is NOT_FOUND, never FORBIDDEN.

"A calendar date, `YYYY-MM-DD`, never converted through local time."
scalar Date
"An ISO 8601 timestamp in UTC."
scalar DateTime

enum Role {
  OWNER
  ADMIN
  MEMBER
  CONTRIBUTOR
}

enum MembershipStatus {
  ACTIVE
  DEACTIVATED
}

enum JoinRequestStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELED
}

"The fixed priority scale. NONE is stored as no priority."
enum Priority {
  URGENT
  HIGH
  MEDIUM
  LOW
  NONE
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  "The signed-in user. Runs without an organization."
  viewer: Viewer!
  "The organization selected by the X-Org-Id header."
  organization: Organization!
}

type Mutation {
  "Org-less. The caller becomes the owner."
  createOrganization(input: CreateOrganizationInput!): OrganizationSummary!
  "Org-less. Asks the owners and admins of the organization with this slug to let the caller in."
  requestToJoinOrganization(slug: String!): ViewerJoinRequest!
  "Org-less. Cancels one of the caller's own pending requests."
  cancelJoinRequest(id: ID!): ViewerJoinRequest!
  "Owner or admin. Never grants OWNER."
  approveJoinRequest(id: ID!, role: Role = MEMBER): Member!
  "Owner or admin."
  rejectJoinRequest(id: ID!): JoinRequest!
  "Owner or admin. Adds an existing account by exact email. Never grants OWNER."
  addMember(email: String!, role: Role = MEMBER): Member!
  "Owner, admin, or member."
  createProject(input: CreateProjectInput!): Project!
  "Every role. The task number and rank are generated by the database."
  createTask(input: CreateTaskInput!): Task!
}

type Viewer {
  id: ID!
  email: String!
  displayName: String!
  "Active memberships, for the organization switcher."
  memberships: [Membership!]!
  "The caller's own join requests, newest first."
  joinRequests: [ViewerJoinRequest!]!
}

type Membership {
  organization: OrganizationSummary!
  role: Role!
}

type OrganizationSummary {
  id: ID!
  slug: String!
  name: String!
}

type ViewerJoinRequest {
  id: ID!
  organization: OrganizationSummary!
  status: JoinRequestStatus!
  createdAt: DateTime!
  decidedAt: DateTime
}

type Organization {
  id: ID!
  slug: String!
  name: String!
  "Members in any status, by display name."
  members(first: Int, after: String): MemberConnection!
  "Owner or admin only. Oldest first."
  joinRequests(
    status: JoinRequestStatus = PENDING
    first: Int
    after: String
  ): JoinRequestConnection!
  "By name."
  projects(includeArchived: Boolean = false, first: Int, after: String): ProjectConnection!
}

type User {
  id: ID!
  displayName: String!
  "Visible to the user and to owners and admins of the current organization; null otherwise."
  email: String
}

type Member {
  user: User!
  role: Role!
  status: MembershipStatus!
  joinedAt: DateTime!
}

type MemberEdge {
  cursor: String!
  node: Member!
}

type MemberConnection {
  edges: [MemberEdge!]!
  pageInfo: PageInfo!
}

type JoinRequest {
  id: ID!
  user: User!
  status: JoinRequestStatus!
  createdAt: DateTime!
  decidedAt: DateTime
  decidedBy: User
}

type JoinRequestEdge {
  cursor: String!
  node: JoinRequest!
}

type JoinRequestConnection {
  edges: [JoinRequestEdge!]!
  pageInfo: PageInfo!
}

type Project {
  id: ID!
  key: String!
  name: String!
  description: String
  isArchived: Boolean!
  createdAt: DateTime!
}

type ProjectEdge {
  cursor: String!
  node: Project!
}

type ProjectConnection {
  edges: [ProjectEdge!]!
  pageInfo: PageInfo!
}

type Status {
  id: ID!
  name: String!
  isClosed: Boolean!
}

type Label {
  id: ID!
  name: String!
  color: String!
}

"Core task fields. Phase 6 adds filters, the board, and history."
type Task {
  id: ID!
  number: Int!
  "Project key and number, for example ENG-12."
  identifier: String!
  title: String!
  description: String
  priority: Priority!
  dueDate: Date!
  status: Status!
  assignee: User
  labels: [Label!]!
  isClosed: Boolean!
  "Only while the task is closed."
  closedAt: DateTime
  createdAt: DateTime!
}

input CreateOrganizationInput {
  name: String!
  slug: String!
  "An IANA timezone name. Defaults to UTC."
  timezone: String
}

input CreateProjectInput {
  name: String!
  "Exactly three characters: a capital letter, then capital letters or digits."
  key: String!
  description: String
}

input CreateTaskInput {
  projectId: ID!
  title: String!
  description: String
  "Defaults to the project's default status."
  statusId: ID
  priority: Priority = NONE
  assigneeId: ID
  dueDate: Date!
  "Up to 20 live labels."
  labelIds: [ID!]
}
