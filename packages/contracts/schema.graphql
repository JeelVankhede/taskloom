# Taskloom GraphQL schema (schema-first). Grows phase by phase; see docs/implementation-plan.md.
#
# Org selection: `viewer` runs without an organization. Every other root field needs the
# selected organization id in the `X-Org-Id` header. A hidden row is NOT_FOUND, never FORBIDDEN.

type Query {
  "The signed-in user. Runs without an organization."
  viewer: Viewer!
  "The organization selected by the X-Org-Id header."
  organization: Organization!
}

type Viewer {
  id: ID!
  email: String!
  displayName: String!
}

type Organization {
  id: ID!
  slug: String!
  name: String!
}
