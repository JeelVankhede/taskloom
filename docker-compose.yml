name: taskloom

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: taskloom
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-app_owner_dev}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_owner -d taskloom']
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskloom
      DB_USER: app_owner
      DB_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-app_owner_dev}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      MAX_PREPARED_STATEMENTS: 200
    ports:
      - '6432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
